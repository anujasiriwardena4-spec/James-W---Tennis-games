name: Deploy to GitHub Pages

# Publishes the repo root as a static site on every push to the default branch.
# `enablement: true` on configure-pages turns Pages on the first time this runs,
# so no manual repo-settings step is needed.
on:
  push:
    branches: ["claude/tennis-player-builder-oo1097"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
